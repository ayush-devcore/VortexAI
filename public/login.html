<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Vortex Workspace</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-12 h-12 bg-gradient-to-br from-[#2563EB] to-[#10B981] rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
        <i data-lucide="zap" class="w-6 h-6 text-white" stroke-width="2.5"></i>
      </div>
      <div>
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Vortex</h1>
        <p class="text-xs text-slate-400 font-semibold uppercase tracking-[0.2em]">Workspace</p>
      </div>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-3xl border border-slate-100 shadow-xl shadow-slate-200/50 p-8">
      <h2 class="text-xl font-bold text-slate-800 mb-2 text-center">Welcome back</h2>
      <p class="text-sm text-slate-500 text-center mb-8">Enter your credentials to access your workspace.</p>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Email</label>
          <input type="email" id="email" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB]/40 transition-all bg-slate-50/50" placeholder="admin@vortex.ai">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Password</label>
          <input type="password" id="password" required class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB]/40 transition-all bg-slate-50/50" placeholder="••••••••">
        </div>

        <button type="submit" id="btn-submit" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-[#2563EB] to-[#10B981] hover:from-[#1D4ED8] hover:to-[#059669] text-white text-sm font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-500/25 mt-2">
          Sign In
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
      <div id="error-msg" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-xs font-medium rounded-lg text-center border border-red-100"></div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-submit');
      const errEl = document.getElementById('error-msg');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full"></span> Authenticating...';
      errEl.classList.add('hidden');

      try {
        const res = await fetch('/v1/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error?.message || data.error || 'Login failed');
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = 'Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
