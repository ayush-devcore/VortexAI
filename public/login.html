<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex — Authentication Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-[#F9FAFB] flex items-center justify-center min-h-screen">
    <div class="glass-panel p-8 rounded-2xl shadow-xl w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-[#2563EB] tracking-tight mb-2">VORTEX</h1>
            <p class="text-sm text-slate-500 font-medium">Enterprise Management System Access Panel</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Corporate Email</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#2563EB] focus:ring-2 focus:ring-blue-100 transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Password Credentials</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#2563EB] focus:ring-2 focus:ring-blue-100 transition">
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3 bg-gradient-to-r from-[#2563EB] to-[#10B981] text-white font-semibold rounded-xl hover:opacity-95 shadow-md active:scale-[0.99] transition">
                Authenticate Session
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');

            btn.disabled = true;
            btn.textContent = 'Verifying Security Identity Token...';

            try {
                const res = await fetch('/v1/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/index.html';
                } else {
                    alert(data.error?.message || 'Authentication credentials rejected.');
                }
            } catch (err) {
                alert('Failed to connect to authentication clusters.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Authenticate Session';
            }
        });
    </script>
</body>
</html>
