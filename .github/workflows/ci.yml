# ─────────────────────────────────────────────────────────
# Vortex Workspace — CI/CD Pipeline
# ─────────────────────────────────────────────────────────

name: Vortex CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ── Lint & Test ──────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex_test
          POSTGRES_DB: vortex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://vortex:vortex_test@localhost:5432/vortex_test

      - name: Build CSS
        run: npm run css:build

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://vortex:vortex_test@localhost:5432/vortex_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          NODE_ENV: test

  # ── Build Docker Image ─────────────────────────────────
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vortex-workspace:${{ github.sha }} .

      - name: Verify health check
        run: |
          docker run -d --name vortex-test -p 3000:3000 \
            -e JWT_SECRET=ci-test \
            -e NODE_ENV=production \
            vortex-workspace:${{ github.sha }}
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop vortex-test
